<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171714" />
    <title>FOODATOI — Compteur en direct</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap');
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #171714;
        color: #fff;
        font-family: 'DM Mono', monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      .eyebrow {
        letter-spacing: 0.13em;
        color: #9b968b;
        font-size: 13px;
        margin: 0 0 20px;
      }
      .count {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: clamp(90px, 28vw, 220px);
        color: #d7e95b;
        line-height: 1;
        margin: 0;
      }
      .label {
        font-size: 15px;
        color: #c8c3b8;
        margin: 20px 0 0;
      }
      .status {
        margin-top: 40px;
        font-size: 11px;
        color: #6b675e;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">FOODATOI · TEST DE CHARGE</p>
    <p class="count" id="count">–</p>
    <p class="label">commandes reçues depuis le début du test</p>
    <p class="status" id="status">Connexion…</p>

    <script type="module">
      import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.57.0';

      const supabase = createClient(
        'https://ffuykessameuonpnyiyc.supabase.co',
        'sb_publishable_MIwz0MWTUF74o8FOsMGQmw_k0yxlvk7'
      );

      const RESTAURANT_ID = '2043c98b-2b77-4ed8-a6ac-f3fdac62af71';
      const since = new Date();

      const countEl = document.querySelector('#count');
      const statusEl = document.querySelector('#status');

      async function refresh() {
        const { data, error } = await supabase.rpc('count_orders_since', {
          p_restaurant_id: RESTAURANT_ID,
          p_since: since.toISOString()
        });

        if (error) {
          statusEl.textContent = 'Erreur de lecture, nouvelle tentative…';
          return;
        }

        countEl.textContent = data;
        statusEl.textContent =
          'Mis à jour à ' + new Date().toLocaleTimeString('fr-FR');
      }

      refresh();
      setInterval(refresh, 3000);
    </script>
  </body>
</html>
