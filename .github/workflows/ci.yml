name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run test suite
        run: npm test

      - name: Production build
        run: npm run build

  deploy:
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # Build servi depuis la racine du domaine personnalisé
      # (www.foodatoi.fr), pas depuis /Mvp-/ - sinon les chemins
      # d'assets pointent au mauvais endroit une fois en ligne.
      - name: Build for the custom domain
        run: npx vite build --base=/
        env:
          VITE_SUPABASE_URL: https://ffuykessameuonpnyiyc.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_MIwz0MWTUF74o8FOsMGQmw_k0yxlvk7

      - name: Publish to gh-pages
        run: |
          touch dist/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          git worktree add /tmp/gh-pages-deploy gh-pages
          rm -rf /tmp/gh-pages-deploy/*
          cp -r dist/. /tmp/gh-pages-deploy/
          cd /tmp/gh-pages-deploy
          git add -A
          git diff --staged --quiet && echo "Rien à déployer" && exit 0
          git commit -m "Deploy ${{ github.sha }}"
          git push origin gh-pages

  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # GitHub Pages met couramment 2-3 minutes à publier après un
      # push - observé directement plusieurs fois pendant cette
      # session en déploiement manuel. Sans cette attente, ce job
      # tourne contre une version pas encore en ligne.
      - name: Wait for GitHub Pages propagation
        run: sleep 150

      # Tourne contre le vrai site en production, sur le resto de
      # démo prévu pour ça - pas d'environnement séparé pour
      # l'instant. Non bloquant (continue-on-error) : un souci
      # réseau ponctuel ici ne doit jamais empêcher un vrai
      # correctif de partir.
      - name: End-to-end order flow (resto démo)
        run: npx playwright test

      # Le sandbox qui a écrit ce test n'a pas accès réseau aux
      # journaux/rapports GitHub (hébergés sur un domaine Azure hors
      # liste autorisée) - ce rapport reste consultable depuis
      # l'interface GitHub par n'importe qui d'autre, capture d'écran
      # et trace de l'échec compris.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
